<!doctype html>
<html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Приёмка карточки менеджера · Команда 17</title>
<style>
:root{color-scheme:light;--paper:#fbfaf7;--ink:#202e2d;--muted:#50625e;--line:#c6ceca;--teal:#205d50;--warn:#82510b}
*{box-sizing:border-box}body{margin:0;background:#f1f1ed;color:var(--ink);font:16px/1.48 "Helvetica Neue",Arial,sans-serif}main{max-width:860px;margin:34px auto;padding:0 24px}header{display:flex;justify-content:space-between;gap:14px;border-bottom:1px solid var(--line);padding-bottom:12px;font-size:14px;color:var(--muted)}h1{font-size:clamp(30px,6vw,46px);letter-spacing:-.045em;margin:30px 0 16px;line-height:1.05}nav,.actions{display:flex;gap:8px;flex-wrap:wrap}button{appearance:none;font:inherit;line-height:1.25;cursor:pointer;color:var(--ink);background:white;border:1px solid #acb8b3;border-radius:5px;padding:10px 14px}button[aria-pressed=true],button.primary{background:var(--teal);color:white;border-color:var(--teal)}button:focus-visible,textarea:focus-visible{outline:3px solid #278b72;outline-offset:3px}article{margin:20px 0 10px;background:var(--paper);border:1px solid var(--line);border-radius:7px;padding:clamp(18px,4vw,34px)}h2{font-size:21px;margin:0 0 18px}.byline,footer{font-size:13px;color:var(--muted)}p{margin:0 0 8px}.bubble{background:white;border:1px solid var(--line);border-radius:5px;max-width:83%;padding:12px 16px;margin:4px 0 22px}.draft{margin:4px 0 10px auto;border:1px dashed #9caaa4;background:#f0f3ef}.right{text-align:right}.decision{padding:12px 0;color:var(--warn);border-top:1px solid var(--line);margin-top:22px}label{display:block;font-weight:600;margin:12px 0 5px}textarea{font:inherit;width:100%;min-height:88px;padding:10px;border:1px solid #98a49f;border-radius:5px}.actions{margin-top:12px}.status{color:var(--teal);font-weight:600;margin-top:12px}.status:empty{display:none}[hidden]{display:none!important}footer{padding:6px 1px 24px}b{font-weight:600}@media(max-width:520px){main{margin:18px auto;padding:0 14px}.bubble{max-width:96%}nav button{padding:8px 10px}header{font-size:12px}}
</style>
<main><header><b>Команда 17 · Интерфейс менеджера</b><span>Учебный макет · № 8</span></header>
<h1>Проверка черновика</h1><nav aria-label="Учебные сценарии"></nav>
<article><h2 id="heading"></h2><p class="byline">Клиент</p><p class="bubble" id="question"></p><p class="byline right">Черновик помощника</p><p class="bubble draft" id="draft"></p><p class="decision" id="reason"></p>
<div id="composer" hidden><label for="reply">Ваш ответ клиенту</label><textarea id="reply" rows="3"></textarea></div><div class="actions" id="actions"><button id="submit" class="primary"></button><button id="edit">Написать свой ответ</button><button id="skip">Пропустить</button></div><p class="status" role="status" id="status"></p></article>
<footer>Прототип для приёмки Романом. Действия выполняются только на этой странице.</footer></main>
<script>
const cases = [
 {label:'Сумма отклонена',title:'В прайсе другая сумма',question:'Сколько стоит радио в «Глобусе», четыре выхода в час на месяц?',draft:'Радио в ТРЦ «Глобус», 4 выхода в час — 73 333 ₽ за месяц.',reason:'Проверка отклонила учебную сумму. Сверьте источник и напишите ответ вручную.',mode:'blocked'},
 {label:'Неизвестный НДС',title:'Ставка найдена, налог требует уточнения',question:'Сколько будет стоить радио на месяц, включая НДС?',draft:'При четырёх выходах в час ставка — 50 400 ₽ за месяц. НДС в прайсе Инцентра не указан.',reason:'Итоговую сумму подтверждает менеджер. Можно сообщить подтверждённую часть и уточнить НДС.',mode:'review'},
 {label:'Обычный черновик',title:'Ответ готов к проверке',question:'Кто предоставляет ролик в этом учебном примере?',draft:'Ролик нужен ваш.',reason:'Источник для этого учебного примера подтверждён.',mode:'normal'}
];
const get=id=>document.getElementById(id);
const nav=document.querySelector('nav');
let active, editing;
function choose(i){
 active=cases[i];editing=false;
 [...nav.children].forEach((button,j)=>button.setAttribute('aria-pressed',String(i===j)));
 for(const [id,key] of [['heading','title'],['question','question'],['draft','draft'],['reason','reason']])get(id).textContent=active[key];
 get('composer').hidden=true;get('reply').value='';get('actions').hidden=false;get('status').textContent='';
 get('submit').hidden=active.mode!=='normal';get('submit').textContent='Отправить клиенту';get('edit').hidden=false;
}
function finish(text){get('status').textContent=text;get('actions').hidden=true;get('composer').hidden=true}
cases.forEach((item,i)=>{const button=document.createElement('button');button.textContent=item.label;button.onclick=()=>choose(i);nav.append(button)});
get('edit').onclick=()=>{editing=true;get('composer').hidden=false;get('submit').hidden=false;get('edit').hidden=true;get('submit').textContent='Отправить свой ответ';get('reply').value=active.mode==='normal'?active.draft:'';get('reply').focus()};
const normalize=s=>s.trim().toLocaleLowerCase('ru').replace(/\s+/g,' ');
get('submit').onclick=()=>{
 if(!editing && active.mode!=='normal')return;
 if(editing && (!normalize(get('reply').value)||(active.mode==='blocked'&&normalize(get('reply').value)===normalize(active.draft)))){
 get('status').textContent='Введите исправленный ответ.';return}
 finish(editing?'В макете принят ответ менеджера.':'В макете принята отправка черновика.')
};
get('skip').onclick=()=>finish('В макете черновик пропущен.');choose(0);
</script></html>
