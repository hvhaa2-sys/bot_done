name: ai-sales-assistant

services:
  app:
    image: ai-sales-assistant:local
    build:
      context: .
    env_file:
      - path: ${ASSISTANT_ENV_FILE:-.env}
        format: raw
    environment:
      ADMIN_HOST: 0.0.0.0
      ADMIN_PORT: '8000'
      DB_PATH: /app/data/app.db
      KB_DIR: /app/data/kb
    ports:
      - '127.0.0.1:${ASSISTANT_PORT:-8000}:8000'
    volumes:
      - assistant-data:/app/data
    read_only: true
    tmpfs:
      - /tmp:mode=1777,size=268435456
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    init: true
    restart: unless-stopped
    stop_grace_period: 30s

volumes:
  assistant-data:
