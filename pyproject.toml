[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
# Ошибки и неиспользуемый код; оформление существующих файлов не меняем.
select = ["E9", "F"]

[tool.coverage.run]
branch = true
source = ["app", "eval", "tools"]

[tool.coverage.report]
show_missing = true
skip_covered = true
